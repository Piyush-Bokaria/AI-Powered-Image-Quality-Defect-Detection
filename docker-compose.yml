version: '3.8'

services:

  db:
    image: postgres:15-alpine
    container_name: image_quality_db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: image_quality_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d image_quality_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: image_quality_backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: image_quality_frontend

    ports:
      - "3000:80"

    depends_on:
      - backend

volumes:
  postgres_data: